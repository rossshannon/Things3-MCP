name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync --locked --group dev

    - name: Run hermetic tests
      run: uv run --locked pytest

    - name: Check imports and syntax
      run: uv run --locked python -m py_compile src/**/*.py

    - name: Run linting
      run: uv run --locked ruff check .

    - name: Check formatting
      run: uv run --locked ruff format --check .

    - name: Run type checking
      run: uv run --locked mypy src/

    - name: Security scan
      run: uv run --locked bandit -r src/

    - name: Check dependencies for vulnerabilities
      run: uv run --locked safety --stage cicd scan --output screen
      env:
        SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
      # Note: Requires SAFETY_API_KEY secret to be set in GitHub repo settings
