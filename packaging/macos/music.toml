name = "ClawBridge Music"
bundle_id = "org.example.ClawBridgeMusic"
entrypoint = "clawbridge.examples.music:main"
usage_description = "Read Music playback state and control play or pause on your request."
state_directory = "Library/Application Support/ClawBridgeMusic"
socket_name = "bridge.sock"
token_name = "bridge.token"
collect_submodules = ["clawbridge"]
apple_event_targets = []
scripting_targets = { "com.apple.Music" = ["com.apple.Music.playback"] }
sandbox_read_only_home = []

[environment_patterns]
CLAWBRIDGE_JOURNAL_PAYLOADS = "[01]"
