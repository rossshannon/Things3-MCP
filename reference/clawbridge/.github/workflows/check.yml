name: Reference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m pip install uv==0.13.6
    - run: uv sync --locked --group dev
    - run: uv run --locked pytest
    - run: uv run --locked ruff check .
    - run: uv run --locked ruff format --check .
    - run: uv run --locked mypy src
    - run: uv run --locked bandit -r src -c pyproject.toml
    - run: uv build

  synthetic-macos-bundle:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12.16"
    - run: python -m pip install uv==0.13.6
    - run: uv sync --locked --no-default-groups --group build
    - run: scripts/build_bridge_app.sh --output build/ci-example
    - run: scripts/sign_bridge_app.sh --app 'build/ci-example/ClawBridge Example.app' --profile ad-hoc-test
    - run: .venv/bin/python scripts/smoke_example_bridge.py --app 'build/ci-example/ClawBridge Example.app' --runtime /private/tmp/clawbridge-ci-check --result build/ci-example/smoke.json
    - uses: actions/upload-artifact@v4
      with:
        name: synthetic-bridge-evidence
        path: |
          build/ci-example/*.json
          build/ci-example/ClawBridge Example.app/Contents/Resources/build-manifest.json
