[project]
name = "clawbridge-reference"
version = "0.1.0"
description = "Local macOS app bridge reference with small app adapters"
readme = "REFERENCE.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
# The pinned SDK imports a private Pydantic helper removed in newer releases.
# Retain the compatible versions already verified by the source project.
mcp = ["mcp==1.11.0", "pydantic==2.9.2", "pydantic-settings==2.10.1"]

[project.scripts]
clawbridge-demo = "clawbridge.demo:main"
clawbridge-mcp = "clawbridge_mcp.server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawbridge", "src/clawbridge_mcp"]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-timeout==2.4.0",
    "ruff==0.12.3",
    "mypy==1.17.0",
    "bandit==1.8.6",
    "build==1.2.2.post1",
    "hatchling==1.27.0",
]
build = ["pyinstaller==6.20.0", "pyinstaller-hooks-contrib==2026.4"]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
target-version = "py312"
line-length = 216

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "T20", "Q", "D"]
ignore = ["S101", "T201", "S110", "S324", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
platform = "darwin"
check_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B404", "B603", "B607"]
